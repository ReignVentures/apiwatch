  - "If you still use the private alpha routes, they're deprecated."
  - {url: "https://developers.notion.com/guides/notion-agent-apis/upgrading-to-public-beta.md", text: "The alpha routes are deprecated"}
  - {url: "https://developers.notion.com/guides/notion-agent-apis/upgrading-to-public-beta.md", text: "POST /v1/agents/:agent_id/chatStream"}
fix_hint: 'Move each alpha call to its replacement in Notion''s Upgrading from the alpha routes guide. Use POST /v1/agents/query for listing agents, POST /v1/sessions/query (filter on agent_id) for threads, POST /v1/sessions/:session_id/events/query for messages (agent replies are agent.message events with content parts), and POST /v1/sessions with agent_id in the body for chat. For chatStream, send POST /v1/sessions with Accept text/event-stream and parse server-sent events instead of NDJSON. Rename thread_id to session_id, and handle the queued, in_progress and terminated statuses (treat unknown statuses as non-terminal). In @notionhq/client use notion.agents.query and the notion.sessions methods.'
