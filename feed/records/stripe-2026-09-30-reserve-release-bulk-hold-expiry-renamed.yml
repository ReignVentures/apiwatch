kind: rest
severity: silent
effective: '2026-09-30'
summary: When you upgrade to Stripe API version 2026-09-30.endive (or an SDK major that pins it), Reserve Release objects report reason hold_expired instead of bulk_hold_expiry
detail: Code that matches the reason property against bulk_hold_expiry stops matching without an error. reason is an open enum, so Stripe also asks integrations to handle unrecognized values.
