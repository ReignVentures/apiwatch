# Promoted 2026-11-01 after independent review (docs/REVIEW.md): pass; facts, date, severity, SDK constants and evidence confirmed; evidence 3 shortened. The SAME_SURFACE pair with the Opus 4.7 record was added to tests/test_records.py.
# Draft authored 2026-11-01 from lead #48 (apiwatch watch, Anthropic release notes entry dated October 30, 2026) by an author agent.
# Checked against the primary sources only: release-notes/overview.md (October 30, 2026 entry), build-with-claude/fast-mode.md
# (deprecation warning, supported models, required beta headers table), and the Go/Java SDK sources on
# raw.githubusercontent.com for constant spellings (anthropic-sdk-go beta.go AnthropicBetaFastMode2026_02_01, message.go
# ModelClaudeOpus4_8; anthropic-sdk-java AnthropicBeta.kt FAST_MODE_2026_02_01, Model.kt CLAUDE_OPUS_4_8).
# Signature choice: modelled on anthropic-2026-07-24-opus-4-7-fast-mode-removed; the fast-mode beta header, counted only in
# files that mention claude-opus-4-8, so ordinary Opus 4.8 use is not flagged. Fast mode on Opus 4.8 needs the beta header
# (fast-mode.md), so a file using it carries the header.
# Known limits: a file that uses fast mode on another model and also mentions claude-opus-4-8 is a false positive; a model id
# set in another file than the betas list is missed. The signatures equal the Opus 4.7 record's (paired in SAME_SURFACE).
