fix_hint: Before November 30, 2026, either drop speed "fast" (and the fast-mode-2026-02-01 beta) from claude-opus-4-8 requests, or move fast-mode traffic to claude-opus-5-5, which does not need the beta header (requests that still send it keep working). Test on your workload before cutting over; see Anthropic's Opus 5.5 migration guide for changes from Opus 4.8.
