# Promoted from feed/drafts (written by an author agent from a changelog lead (apiwatch watch)) after independent review (docs/REVIEW.md) on 2026-09-24: fix. Summary says public preview plainly; detail names the preview SDKs and the compatibility layer; added Go/.NET access paths. No context needed: the field doesn't exist in the GA SDK.
# Scope: PUBLIC PREVIEW API version 2026-07-29.preview only. collected_information.tax_ids was itself a preview field (the changelog links it at api-version=2026-06-24.preview);
# the GA SDKs (stripe-node v22.6.0 Checkout/Sessions.ts) have no collected_information.tax_ids. Removal ships in stripe-python v15.5.0b1 / stripe-node v22.5.0-beta.1 (pinned to 2026-07-29.preview).
# Signatures are the dotted access paths: bare "tax_ids" would also hit customer_details.tax_ids, which this change doesn't touch.
