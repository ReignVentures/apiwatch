id: stripe-2026-07-29-checkout-collected-information-tax-id
vendor: Stripe
surface: Stripe API 2026-07-29.preview (public preview) — Checkout Session collected_information.tax_ids renamed to tax_id
kind: rest
severity: breaking
effective: '2026-07-29'
summary: In Stripe's public preview API version 2026-07-29.preview, the Checkout Session collected_information.tax_ids array was replaced by collected_information.tax_id, a single object or null
detail: This applies only to callers on 2026-07-29.preview or a later preview version, or on the preview SDKs that pin it (stripe-python 15.5.0b1, stripe-node 22.5.0-beta.1). On those versions the tax_ids array property no longer exists, so code that reads or iterates it breaks. On older API versions a compatibility layer still returns tax_ids as a single-element array.
