fix_hint: Recreate the evals you still need in Promptfoo (a promptfooconfig.yaml with your prompts, provider, test cases and assertions), following OpenAI's Promptfoo migration guide, and remove the OpenAI Evals API calls. Save any eval results you want to keep before November 30, 2026, and re-validate recreated graders, especially LLM-as-a-judge ones, before relying on their scores.
