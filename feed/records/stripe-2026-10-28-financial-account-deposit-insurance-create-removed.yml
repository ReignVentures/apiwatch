# Written by an author agent from changelog lead #40 (apiwatch watch), from the primary source page only. Independent review (docs/REVIEW.md) 2026-10-31 by a fresh agent: fix (Java/PHP/optional-chaining spellings, attribute reads excluded, preview SDK pin gate with beta CHANGELOG evidence), applied.
# Scope: PUBLIC PREVIEW API version 2026-10-28.preview (v2 money management).
# deposit_insurance_eligibility stays a read-only property on the Financial Account response, so plain reads are fine. The context groups require a v2 Financial Account
# create call (SDK service call, create-params type, or a POST to the REST path) in the same file; attribute reads are excluded (see detail).
# repo_context gates on a preview API version string or the preview SDK pins (stripe-python 16.2.0b*, stripe-node 23.2.0-beta*, both pinned to 2026-10-28.preview per their beta CHANGELOGs) (digit before ".preview") so GA integrations aren't flagged.
id: stripe-2026-10-28-financial-account-deposit-insurance-create-removed
vendor: Stripe
surface: 'Stripe API 2026-10-28.preview (public preview) — deposit_insurance_eligibility removed from v2 Financial Account create params (storage)'
kind: rest
severity: breaking
effective: '2026-10-28'
summary: 'In Stripe''s public preview API version 2026-10-28.preview, v2 Financial Account create no longer accepts the deposit_insurance_eligibility parameter in the storage hash'
detail: 'This applies only to callers on the public preview version 2026-10-28.preview, or on the preview SDKs that pin it (stripe-python 16.2.0b1, stripe-node 23.2.0-beta.1). Stripe says that to avoid errors you must remove deposit_insurance_eligibility from v2 Financial Account create requests; previously the parameter was accepted but had no effect. It stays a read-only property on the Financial Account response object, so reading it is unaffected. Attribute reads (obj.deposit_insurance_eligibility) are not flagged; an assignment like params.storage.deposit_insurance_eligibility = … is also not flagged.'
