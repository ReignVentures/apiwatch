fix_hint: Switch to the listed substitute. Fine-tuned models listed here shut down on the same date, and OpenAI restricts creating new fine-tuning jobs, so confirm you can re-train before planning on it. Check config files and env vars too, where bare aliases like "gpt-4" tend to live.
