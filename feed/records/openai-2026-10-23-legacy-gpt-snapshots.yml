detail: Announced April 22, 2026. Includes the unversioned aliases, so code that never pinned a snapshot still breaks. Covered ids are gpt-3.5-turbo(-0125), gpt-4(-0613), gpt-4-1106-preview, gpt-4-turbo(-2024-04-09), gpt-4.1-nano(-2025-04-14), gpt-4o-2024-05-13, gpt-image-1, o1(-2024-12-17), o1-pro(-2025-03-19), o3-mini(-2025-01-31), o4-mini(-2025-04-16), plus -completions variants and ft-o4-mini-2025-04-16. OpenAI says fine-tuned versions of these models follow the same shutdown schedule as their base models. Substitutes are gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna, and, for gpt-image-1, gpt-image-2.5-sunburst or gpt-image-2.5-flare.
