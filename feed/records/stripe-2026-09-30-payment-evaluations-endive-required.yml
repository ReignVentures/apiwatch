evidence:
- Radar Standard users must now use API version `2026-09-30.endive` or later
- payment_evaluation_on_api_version_not_supported
- error (HTTP status 403)
- Previously, an unavailable score returned `-1`. After upgrading, it returns `null` instead.
fix_hint: If you're on Radar Standard, call Payment Evaluations with API version 2026-09-30.endive or later. Before upgrading, handle null signal scores (replace checks for -1 with checks for null) and fall back to each signal's risk_level, such as fraudulent_payment.risk_level.
