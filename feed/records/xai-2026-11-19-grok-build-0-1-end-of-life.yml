# plus the xAI Models page ("Which model should I choose?") and the Grok 4.5 model page (aliases). Independent review (docs/REVIEW.md) on 2026-11-22 by a separate fresh agent: fix, applied (detail notes the stale
# Models page listing; fix_hint price comparison made explicit and an unsupported reasoning-effort caveat removed). check ok.
# Severity breaking: the release note says the model "is no longer served on the API" and names no reroute, so no routes_to.
# The release note names no replacement; the fix_hint uses the Models page, which says to use Grok 4.7 for code.
# grok-build-latest is not a signature: the Grok 4.5 page lists it as an alias of grok-4.5, not of grok-build-0.1.
