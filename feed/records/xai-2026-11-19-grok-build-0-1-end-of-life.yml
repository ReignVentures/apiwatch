evidence:
  - "grok-build-0.1 end of life"
  - "reached end of life on November 19, 2026"
  - "is no longer served on the API"
  - {url: "https://docs.x.ai/developers/models", text: "including code, use Grok 4.7"}
fix_hint: "Change the model to a served model. xAI's Models page recommends grok-4.7 for code; it is priced higher than grok-build-0.1 was ($2 / $6 vs $1 / $2 per 1M input / output tokens below 200k prompt tokens), so check cost after switching. Don't switch to grok-build-latest expecting the same model: xAI lists it as an alias of grok-4.5."
