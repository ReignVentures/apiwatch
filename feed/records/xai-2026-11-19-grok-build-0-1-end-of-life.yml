id: xai-2026-11-19-grok-build-0-1-end-of-life
vendor: xAI
surface: coding model grok-build-0.1
kind: model
severity: breaking
effective: "2026-11-19"
summary: grok-build-0.1 reached end of life on November 19, 2026 and is no longer served on the xAI API
detail: "xAI's release notes (November entry) say grok-build-0.1 reached end of life on November 19, 2026 and is no longer served on the API. They do not say requests are routed to another model, and they do not describe the error returned. The entry names no replacement; xAI's Models page says to use Grok 4.7 for everything outside audio, image and video, including code. grok-build-latest is not affected by this entry: xAI's docs list it as an alias of grok-4.5. grok-code-fast-1, which has redirected to grok-build-0.1 since May 15, 2026, is covered by the May 15 retirement record. As of November 22, 2026, xAI's Models page pricing table and the grok-build-0.1 model page still list the model; the release note is the dated statement of end of life."
signatures: ["grok-build-0.1"]
