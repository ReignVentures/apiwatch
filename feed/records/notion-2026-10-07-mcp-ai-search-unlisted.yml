fix_hint: Call notion-search for Notion content in new code, and notion-connector-search for connected sources such as Slack or Google Drive when the session lists it. Don't infer AI search access from whether notion-ai-search is listed; read connector_search from notion-get-tool-access if you need it. On workspace-owned connections, use the search tool the connection lists.
