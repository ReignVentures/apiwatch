# Authored from the primary source (Notion changelog and Supported tools) on 2026-10-09. Independent review (docs/REVIEW.md) on 2026-10-09: pass, no changes.
id: notion-2026-10-07-mcp-ai-search-unlisted
vendor: Notion MCP
surface: MCP tool notion-ai-search (ai-search for OpenAI clients) — dropped from tools/list
kind: mcp
severity: silent
effective: "2026-10-07"
summary: Hosted Notion MCP sessions now list one search tool, notion-search; notion-ai-search no longer appears in tools/list but stays callable by name
detail: Hosted Notion MCP sessions now list one content-search tool, notion-search (search for OpenAI clients), whose description matches the user's AI search access. notion-ai-search (ai-search for OpenAI clients) no longer appears in tools/list. It stays callable by name and behaves as before, so clients with a cached tool list keep working, but agents that pick tools from a fresh tools/list no longer see it, and code that looks for it there won't find it. The server instructions also tell clients to use the Notion search tool for every content search, and the Supported tools page says to call notion-search in new code. No removal date is given. notion-get-tool-access still reports AI search access under ai_search. Workspace-owned connections, which have a selected tool list, keep the earlier tool list and descriptions, as does a session where Notion can't read the user's AI search access while it builds the tool list.
signatures: ["notion-ai-search", "ai-search"]
