fix_hint: Call notion-search (search for OpenAI clients) for content search in new code; it runs AI search when the user has it. Don't infer AI search access from whether notion-ai-search is listed; read ai_search from notion-get-tool-access if you need it. On workspace-owned connections, use the search tool the connection lists.
