surface: MCP tool notion-ai-search (ai-search for OpenAI clients) — dropped from tools/list
kind: mcp
severity: silent
effective: "2026-10-07"
summary: From October 7, 2026, hosted Notion MCP sessions no longer list notion-ai-search (ai-search for OpenAI clients) in tools/list; it stays callable by name, and new code should call notion-search (and, since October 20, notion-connector-search for connected sources)
detail: On October 7, 2026, hosted Notion MCP sessions began listing one content-search tool, notion-search (search for OpenAI clients), whose description then matched the user's AI search access, and the server instructions told clients to use the Notion search tool for every content search. notion-ai-search (ai-search for OpenAI clients) no longer appears in tools/list. It stays callable by name and still searches Notion and connected sources together, so clients with a cached tool list keep working, but agents that pick tools from a fresh tools/list no longer see it, and code that looks for it there won't find it. No removal date is given. Since October 20, 2026, hosted notion-search searches only Notion pages and databases, and connected sources are searched with a new notion-connector-search tool, which sessions list when the user has AI search and the workspace has a connected source (see notion-2026-10-20-mcp-connector-search-split); the Supported tools page says to call notion-search and notion-connector-search in new code, and notion-get-tool-access reports AI search access under connector_search. Workspace-owned connections, which have a selected tool list, keep the earlier tool list and descriptions, and report ai_search only when notion-ai-search is selected.
