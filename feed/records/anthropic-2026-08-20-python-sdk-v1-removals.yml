# Promoted from feed/drafts (written by an author agent from a changelog lead (apiwatch watch)) after independent review (docs/REVIEW.md) on 2026-09-24: fix. The author's context also matched TypeScript files (matching ignores case, so 'import Anthropic from' contains 'import anthropic'); replaced with Python-only import forms. Added schema-dict output_format and anthropic.Transport from MIGRATION.md. temperature= is right: on v1 it's a TypeError on Messages methods for every model.
# Only bites when a project upgrades to anthropic>=1; 0.x releases keep working. Severity is breaking because the removed names raise (TypeError / ImportError / AttributeError) after that upgrade.
# context is Python import forms, not bare "anthropic", so TypeScript files (@anthropic-ai/sdk) and non-SDK files are not flagged.
# temperature=/top_p=/top_k= are the Python keyword-argument forms; extra_body={"temperature": ...} (the documented escape hatch) is deliberately not matched.
# Not covered by signatures (detail/fix_hint only): httpx -> httpx2, async .with_raw_response parse(), Bedrock region, header-casing and bytes-header changes, isinstance(x, Stream).
