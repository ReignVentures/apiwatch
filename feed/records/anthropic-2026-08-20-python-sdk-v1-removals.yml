id: anthropic-2026-08-20-python-sdk-v1-removals
vendor: Anthropic
surface: Anthropic Python SDK v1.0 (anthropic>=1) — removed Text Completions API, sampling parameters, compaction_control and deprecated exports
kind: sdk
severity: breaking
effective: '2026-08-20'
summary: Anthropic Python SDK v1.0 (August 20, 2026) removed long-deprecated surface; completions.create, HUMAN_PROMPT/AI_PROMPT, temperature/top_p/top_k, schema-dict output_format and compaction_control fail after upgrading to anthropic>=1
detail: v1.0 requires Python 3.10+ and moves the HTTP layer from httpx to httpx2 (passing an httpx.Client as http_client raises TypeError). It removes client.completions.create() with HUMAN_PROMPT/AI_PROMPT, the temperature/top_p/top_k parameters on Messages methods (passing them is a TypeError; the API still honours them for older models via extra_body), output_format as a schema dict, the tool runner's compaction_control/CompactionControl, and the exports BetaBase64PDFBlockParam, anthropic.Transport, ProxiesTypes and agent_toolset.READ_MAX_BYTES. Async .with_raw_response results now need await response.parse(), and AnthropicBedrock raises when no AWS region is configured.
