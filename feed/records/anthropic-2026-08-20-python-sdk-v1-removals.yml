fix_hint: 'Before bumping to anthropic>=1: move completions.create calls to messages.create; drop temperature/top_p/top_k (use extra_body={"temperature": ...} only for an older model that still honours it); pass schema dicts as output_config={"format": {...}} and keep output_format= for classes; replace compaction_control with server-side context_management compaction; swap BetaBase64PDFBlockParam for BetaRequestDocumentBlockParam and READ_MAX_BYTES for DEFAULT_MAX_FILE_BYTES; build custom HTTP objects from httpx2; await response.parse() on async raw responses; set aws_region for AnthropicBedrock.'
