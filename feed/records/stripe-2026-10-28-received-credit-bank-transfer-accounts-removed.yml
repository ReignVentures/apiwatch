# Written by an author agent from changelog lead #43 (apiwatch watch), from the primary source page only. Independent review (docs/REVIEW.md) 2026-10-31 by a fresh agent: fix (scope only), applied.
# Scope: PUBLIC PREVIEW API version 2026-10-28.preview (v2 money management Received Credits).
# us_bank_account / gb_bank_account / sepa_bank_account are everywhere in GA v1 Stripe code (PaymentMethods, etc.), so context needs a Received Credit, bank_transfer and money
# management reference in the same file, and repo_context gates on a preview API version string or the preview SDK pins (stripe-python 16.2.0b*, stripe-node 23.2.0-beta*, both pinned to 2026-10-28.preview per their beta CHANGELOGs). A file that also handles other v2 money management objects using these
# names (for example inbound transfers) may still be flagged on those lines.
id: stripe-2026-10-28-received-credit-bank-transfer-accounts-removed
vendor: Stripe
surface: 'Stripe API 2026-10-28.preview (public preview) — v2 Received Credit bank_transfer us_bank_account, gb_bank_account, sepa_bank_account removed (use originating_bank_account)'
kind: rest
severity: breaking
effective: '2026-10-28'
summary: 'In Stripe''s public preview API version 2026-10-28.preview, the v2 Received Credit bank_transfer hash drops us_bank_account, gb_bank_account and sepa_bank_account in favor of originating_bank_account'
detail: 'This applies only to callers on the public preview version 2026-10-28.preview, or on the preview SDKs that pin it (stripe-python 16.2.0b1, stripe-node 23.2.0-beta.1), who use the v2 Received Credits API. The country-specific bank account properties are removed from bank_transfer; bank_transfer.originating_bank_account replaces them, with aba, iban and sort_code sub-types. Code that reads the removed properties must switch. Stripe classes this as a breaking change.'
