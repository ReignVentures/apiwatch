id: greenhouse-2026-08-31-harvest-v1v2-retired
vendor: Greenhouse
surface: Harvest API v1/v2
kind: rest
severity: breaking
effective: "2026-08-31"
summary: Harvest v1/v2 removed on August 31, 2026; integrations must be on v3 (OAuth + cursor pagination)
detail: v1/v2 used Basic Auth with an API token; v3 requires an OAuth 2.0 bearer token (client credentials for custom integrations). v3 list endpoints page with an opaque cursor taken from the Link header's rel="next". A request that carries a cursor must have no other query params, so filters and per_page carried over from page-number loops break.
