- will be disabled only when the underlying base model is deprecated
- {url: "https://developers.openai.com/api/docs/guides/supervised-fine-tuning.md", text: "create training jobs until January 6, 2027"}
- {url: "https://developers.openai.com/api/reference/resources/fine_tuning/subresources/jobs/methods/create.md", text: "api.openai.com/v1/fine_tuning/jobs"}
fix_hint: Run any training you still need before January 6, 2027, and remove automated job creation that would start failing then. Existing fine-tuned models keep serving inference until their base model's shutdown date on OpenAI's deprecations page, so plan to move those workloads to a current base model by that date; OpenAI names no replacement for creating new fine-tunes.
