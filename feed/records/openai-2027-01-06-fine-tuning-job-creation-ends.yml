fix_hint: Run any training you still need before December 15, 2026, and remove automated job creation that would start failing then. Existing fine-tuned models keep serving inference until their base model's shutdown date on OpenAI's deprecations page, so plan to move those workloads to a current base model by that date; OpenAI names no replacement for creating new fine-tunes.
