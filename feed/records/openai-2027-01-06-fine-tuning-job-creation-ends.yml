# Written by Claude on 2026-11-19 from the deprecations page (Feature and endpoint deprecations row, notice May 7, 2026, and the "Update to OpenAI's self-serve fine-tuning" timeline it links), the Supervised fine-tuning guide, and the fine-tuning jobs API reference (POST /fine_tuning/jobs; Python client.fine_tuning.jobs.create, TypeScript client.fineTuning.jobs.create).
# Only job creation ends; inference on fine-tuned models goes on until each base model shuts down (other records date those). So the signatures are the create call. The raw path /v1/fine_tuning/jobs is also the list-jobs path (GET), which the sources don't say stops; that line would be flagged too. exclude "/v1/fine_tuning/jobs/" keeps per-job calls (retrieve, cancel, events, checkpoints) off.
# context "openai": other providers expose the same shapes (Mistral's SDK has client.fine_tuning.jobs.create; not confirmed from Mistral's docs, which render in the browser) and Azure OpenAI uses the same SDK with its own timeline; a file naming AzureOpenAI still opens the gate. Fine-tuning graders (/v1/fine_tuning/alpha/graders) are not signed: the timeline doesn't date them.
# Independent review (docs/REVIEW.md) on 2026-11-19: fix: added exclude "/v1/fine_tuning/jobs?" so a list-jobs GET with a query string (the list reference's own curl form) is no longer flagged. Keeping the bare /v1/fine_tuning/jobs signature is acceptable: it is the create reference's curl form for raw-HTTP job creation, which the SDK signatures miss. A bare-path GET with no query string (or a URL constant used only for listing) still matches; that false positive is logged for docs/GAPS.md. All other fields checked against the deprecations row and fine-tuning timeline, the Supervised fine-tuning guide and the jobs reference (Python fine_tuning.jobs.create, TypeScript fineTuning.jobs.create); no other changes.
# 2026-11-25 night shift: OpenAI moved the cutoff up from January 6, 2027 to December 15, 2026 (deprecations row and the "Update to OpenAI's self-serve fine-tuning" timeline, Supervised fine-tuning guide). effective, summary, detail, fix_hint and the dated evidence re-quoted; the id keeps its original date so record links stay stable. Signatures and scope unchanged. verified reset to false pending review.
# 2026-11-25 independent review (docs/REVIEW.md, fresh agent): fix: summary now says self-serve fine-tuning jobs, applied. apiwatch check ok.
id: openai-2027-01-06-fine-tuning-job-creation-ends
vendor: OpenAI
surface: Fine-tuning job creation (POST /v1/fine_tuning/jobs)
kind: rest
severity: breaking
effective: "2026-12-15"
summary: From December 15, 2026 (moved up from January 6, 2027), no OpenAI organization can create new self-serve fine-tuning jobs; existing fine-tuned models keep serving inference until their base model shuts down
detail: "Notice date May 7, 2026. OpenAI's deprecations page lists self-serve fine-tuning job creation with a December 15, 2026 date and status Restricted access, pointing to its fine-tuning timeline, which says OpenAI moved the cutoff up from the previously announced January 6, 2027 to December 15, 2026. That timeline stopped job creation for organizations that had never run fine-tuning (May 7, 2026) and for those with no fine-tuned model inference in the past 60 days (July 2, 2026), and says that starting December 15, 2026 no organization can create new self-serve fine-tuning jobs. Inference on each existing fine-tuned model continues until OpenAI retires its underlying base model. The Supervised fine-tuning guide says eligible existing customers can create training jobs until December 15, 2026, unless the base model shuts down earlier. OpenAI names no replacement for training new fine-tuned models."
signatures:
