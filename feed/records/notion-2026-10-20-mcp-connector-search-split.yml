fix_hint: In hosted sessions, call notion-search for Notion pages and databases and notion-connector-search for connected sources; for a question that covers both, call both in parallel. Only call notion-connector-search when the session lists it, and pass sources (for example ["slack"]) to limit which sources it searches. To read a full result on a Notion MCP OAuth connection or personal access token, pass its id or url to notion-fetch (Outlook, Google Calendar, and Confluence results can't be fetched, and Custom Agents and other bots can't open these results; use the result's title, highlight, and url), and check warnings and searchTargetStatuses for sources that failed or timed out. On workspace-owned connections, use the search tool the connection lists.
