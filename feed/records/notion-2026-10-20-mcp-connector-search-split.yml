id: notion-2026-10-20-mcp-connector-search-split
vendor: Notion MCP
surface: MCP tool notion-search (search for OpenAI clients) — connected sources moved to new notion-connector-search
kind: mcp
severity: silent
effective: "2026-10-20"
summary: In hosted Notion MCP sessions, notion-search now searches only Notion pages and databases; connected sources such as Slack and Google Drive moved to a new notion-connector-search tool
detail: In hosted Notion MCP sessions, notion-search now searches only Notion pages and databases and reports type "workspace_search"; it no longer returns results from connected sources, with no error; when the session lists notion-connector-search, a content search result ends with a short note that connected sources weren't searched, except in ChatGPT. The new notion-connector-search tool searches connected sources such as Slack, Google Drive, GitHub, Jira, mail, and calendar, and not Notion. Sessions list it only when the user has AI search (Business or Enterprise with Notion AI) and the workspace has at least one connected source. It takes question, keywords, lookback, and an optional sources list; the response reports searchedSources, lists failed or timed-out sources in searchTargetStatuses, and explains skipped or failed sources in warnings. Since October 26, 2026, notion-fetch opens its results by id or url in hosted sessions (Notion MCP OAuth connections and personal access tokens, for users with the same AI access), except Outlook, Google Calendar, and Confluence results. It keeps its notion- prefix for OpenAI clients, and notion-get-tool-access reports its access under connector_search. notion-ai-search still doesn't appear in tools/list but stays callable by name and still searches Notion and connected sources together. Workspace-owned connections keep their selected tools and don't list notion-connector-search.
