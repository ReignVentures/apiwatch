  - "October 20, 2026"
  - {url: "https://developers.notion.com/guides/mcp/mcp-supported-tools", text: "In new code, call notion-search and notion-connector-search."}
fix_hint: In hosted sessions, call notion-search for Notion pages and databases and notion-connector-search for connected sources; for a question that covers both, call both in parallel. Only call notion-connector-search when the session lists it, and pass sources (for example ["slack"]) to limit which sources it searches. Open its results by their url, not with notion-fetch, and check warnings and searchTargetStatuses for sources that failed or timed out. On workspace-owned connections, use the search tool the connection lists.
