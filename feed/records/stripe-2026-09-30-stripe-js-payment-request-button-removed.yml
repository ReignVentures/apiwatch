id: stripe-2026-09-30-stripe-js-payment-request-button-removed
vendor: Stripe
surface: Stripe.js Endive — payment request button element (elements.create('paymentRequestButton'), React PaymentRequestButtonElement)
kind: sdk
severity: breaking
effective: '2026-09-30'
summary: In Stripe.js Endive (js.stripe.com/endive or @stripe/stripe-js 10), elements.create('paymentRequestButton') throws an error, which also breaks the React PaymentRequestButtonElement
detail: Stripe deprecated the payment request button and removed support for it in Endive; @stripe/stripe-js 10.0.0 removes it, and @stripe/react-stripe-js 7.0.0 (which requires @stripe/stripe-js 10) removes the React component. Stripe.js versions through Dahlia still support it.
