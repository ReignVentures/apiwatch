id: stripe-2026-09-30-sepa-creditor-id-always-returned
vendor: Stripe
surface: Stripe API 2026-09-30.endive — Account settings.sepa_debit_payments.creditor_id returns the shared SEPA Creditor Identifier
kind: rest
severity: silent
effective: '2026-09-30'
summary: When you upgrade to Stripe API version 2026-09-30.endive (or an SDK major that pins it), Account sepa_debit_payments.creditor_id returns Stripe's shared SEPA Creditor Identifier instead of being omitted, so null checks that detect the shared identifier stop working
detail: Previously the property was omitted for accounts using Stripe's country-specific shared identifier. It now returns that shared value, so code that infers the shared identifier from a null or missing creditor_id gets the wrong answer without an error.
