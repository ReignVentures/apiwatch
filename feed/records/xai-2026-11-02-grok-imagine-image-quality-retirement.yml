detail: "xAI retires the grok-imagine-image-quality slug on November 2, 2026 (60-day notice from September 2). Requests to it on /v1/images/generations and /v1/images/edits are then served by grok-imagine-image-2.0 with quality low, with request and response shapes unchanged, and billed at that model's low-quality rate, which xAI says is $0.01 per image cheaper. grok-imagine-image-pro, which already redirects to grok-imagine-image-quality, follows it to grok-imagine-image-2.0. grok-imagine-image (1.0) is not affected."
