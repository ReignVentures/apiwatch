id: stripe-2026-03-26-sdk-decimal-type
vendor: Stripe
surface: Stripe SDKs (stripe-python v15, stripe-node v21) — decimal_string fields such as unit_amount_decimal
kind: sdk
severity: silent
effective: "2026-03-26"
summary: stripe-python v15 and stripe-node v21 return unit_amount_decimal and other decimal_string fields as Decimal, not string; string equality checks silently go false
detail: The JSON on the wire is unchanged. The SDKs now parse decimal_string fields (unit_amount_decimal, quantity_decimal, fx_rate, ...) into decimal.Decimal (Python) or Stripe.Decimal (Node). Code like unit_amount_decimal == "1000" returns false without an error.
