# Promoted from feed/drafts (written by an author agent from a changelog lead (apiwatch watch)) after independent review (docs/REVIEW.md) on 2026-10-02: fix. Facts correct; Java setPayto, REST-form payto[...] and PHP static update added; gates widened.
# Scope: GA API version 2026-09-30.endive (changelog section "2026-09-30.endive"). Bites only callers who send Stripe-Version 2026-09-30.endive
# (or a later .endive version: the Endive overview says later Endive versions add only additive changes) or who move to the SDK majors that pin it,
# released 2026-09-30: stripe-python 16.0.0, stripe-node 23.0.0, stripe-go v87.0.0, stripe-ruby 20.0.0, stripe-java 34.0.0, stripe-dotnet 53.0.0, stripe-php 22.0.0.
# repo_context gate (plain substring, lowercased, searched in code and dependency manifests): ".endive" catches the version string in code/config;
# the SDK majors are matched in their manifest shapes ("stripe==16", '"stripe": "^23', "stripe-go/v87", "stripe (20." in Gemfile.lock,
# "stripe-java:34." in Gradle, 'Stripe.net" Version="53' in .csproj) because bare "16.0.0"/"23.0.0" would match any package at that version.
# floating ranges such as "stripe>=15", and accounts whose default API version was upgraded in Workbench with no version in code.
# payto is also a payment method type and a payment_method_options key, so signatures are key/argument forms only and the file must also
# contain a PaymentMethod update call. A file that also sets payment_method_options.payto on an intent could still be flagged.
id: stripe-2026-09-30-payment-method-update-payto-removed
vendor: Stripe
surface: Stripe API 2026-09-30.endive — payto (account_number, bsb_number, pay_id) removed from PaymentMethod update
kind: rest
severity: breaking
effective: '2026-09-30'
summary: When you upgrade to Stripe API version 2026-09-30.endive (or an SDK major that pins it), sending payto or its sub-fields when updating a PaymentMethod returns an error instead of a 200
detail: The update endpoint no longer accepts payto, payto[account_number], payto[bsb_number] or payto[pay_id]. The API never persisted these values, so removing them from update calls doesn't change stored data.
