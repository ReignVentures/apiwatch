summary: Rovo MCP switched OAuth servers on May 27, 2026; clients that cache client_id or the auth discovery document may start to fail
detail: From May 27, 2026 all requests to https://mcp.atlassian.com/v1/mcp/ use the new auth server (Atlassian Identity) for DCR OAuth. Cached client_ids and cached /.well-known/oauth-authorization-server documents aren't recognized by the new server.
