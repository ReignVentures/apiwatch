- url: https://github.com/stripe/stripe-python/releases/tag/v15.5.0b1
  text: Remove support for `payout_v1` on `V2.MoneyManagement.ReceivedCredit.BalanceTransfer`
fix_hint: Before moving to 2026-07-29.preview, match balance_transfer.type against payout and read the payout property instead of payout_v1.
