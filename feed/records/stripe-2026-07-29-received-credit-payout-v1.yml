# Promoted from feed/drafts (written by an author agent from a changelog lead (apiwatch watch)) after independent review (docs/REVIEW.md) on 2026-09-24: fix. Summary says public preview plainly; detail limited to source statements plus the direct consequence; added PayoutV1. Silent: the enum value changes with no error (Stripe's index says non-breaking, its REST and SDK tables say removed).
# Stripe labels this "Non-breaking" and a deprecation. Severity is silent because on 2026-07-29.preview the type reads "payout" instead of "payout_v1",
# so equality checks go false without an error, and the changelog's REST table and stripe-python v15.5.0b1 list payout_v1 as removed from balance_transfer.
# v2 ReceivedCredit (money management) is not in the GA stripe-node SDK tree, so every caller is on a preview version.
id: stripe-2026-07-29-received-credit-payout-v1
vendor: Stripe
surface: Stripe API 2026-07-29.preview (public preview) — v2 ReceivedCredit balance_transfer.type payout_v1 → payout
kind: rest
severity: silent
effective: '2026-07-29'
summary: In Stripe's public preview API version 2026-07-29.preview, v2 ReceivedCredit balance transfers from payouts report type payout instead of the deprecated payout_v1
detail: This applies only to callers on 2026-07-29.preview or a later preview version. Integrations on earlier API versions aren't affected. On the preview version the balance_transfer hash on a v2 ReceivedCredit uses payout as the type value, with a new payout property. Stripe describes the legacy payout_v1 property and enum value as deprecated, and the preview SDKs remove them, so code that matches type against payout_v1 stops matching without an error.
