# Promoted from feed/drafts (written by an author agent from a changelog lead (apiwatch watch)) after independent review (docs/REVIEW.md) on 2026-09-24: fix. Summary says public preview plainly and that GA dahlia is unaffected; added PaymentMethodTypes (Go/.NET); kept the context gate on the preview version string (the only gate that doesn't flag GA integrations).
# Scope: this is in the PUBLIC PREVIEW API version 2026-08-26.preview (changelog section "2026-08-26.preview"), not in GA 2026-08-26.dahlia.
# GA SDKs are unaffected: stripe-python v15.6.0 / stripe-node v22.6.0 pin 2026-08-26.dahlia and still accept payment_method_types.
# The removal ships in the preview SDKs that pin 2026-08-26.preview: stripe-python v15.7.0b1 (and v15.7.0a*), stripe-node v22.7.0-beta.1 (and v22.7.0-alpha.*).
# context gates the ubiquitous payment_method_types to files that pin the preview version string, so GA integrations aren't flagged.
# Add later .preview version strings to context as Stripe ships them (the page says "2026-08-26.preview or later").
# 2026-09-24 scope: gated on the repo pinning the preview (API version string, or the preview SDKs stripe-python 15.7.0b* / stripe-node 22.7.0-beta.*, in code or a manifest) instead of the version string in the same file. Later preview SDK versions must be added as they ship.
id: stripe-2026-08-26-intents-payment-method-types-removed
vendor: Stripe
surface: Stripe API 2026-08-26.preview (public preview) — payment_method_types on PaymentIntent create/update/confirm and SetupIntent create/update
kind: rest
severity: breaking
effective: '2026-08-26'
summary: Stripe's public preview API version 2026-08-26.preview removed payment_method_types as a writable parameter on PaymentIntents and SetupIntents; sending it returns a 400 error
detail: This applies only to callers who send Stripe-Version 2026-08-26.preview or a later preview version, or who use the preview SDKs that pin it (stripe-python 15.7.0b1, stripe-node 22.7.0-beta.1). It isn't part of the GA 2026-08-26.dahlia release. On the preview version, passing payment_method_types to PaymentIntent create, update or confirm, or to SetupIntent create or update, fails with error code payment_method_types_no_longer_supported. Both objects still return payment_method_types as a read-only property.
