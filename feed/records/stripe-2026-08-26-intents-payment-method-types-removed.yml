fix_hint: Before moving to 2026-08-26.preview, drop payment_method_types from PaymentIntent and SetupIntent writes and rely on dynamic payment methods. Use excluded_payment_method_types to remove types, or allowed_payment_method_types to list the types you accept. You can still read payment_method_types on the returned object.
