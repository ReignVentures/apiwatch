# Re-reviewed 2026-10-05 (docs/REVIEW.md): fix. Stripe reworded the page; evidence 1 replaced, Stripe-Version string added; detail notes Ruby/PHP/Go/.NET are 'not affected' at the type level but still get the REST change via their pinned majors.
# Promoted from feed/drafts (written by an author agent from a changelog lead (apiwatch watch)) after independent review (docs/REVIEW.md) on 2026-10-02: fix. Facts correct; context needed an account-reject call (stripe + reject matched any Promise); SDK scope named; canonical gates.
# Scope: GA API version 2026-09-30.endive (changelog section "2026-09-30.endive"). Bites only callers who send Stripe-Version 2026-09-30.endive
# (or a later .endive version: the Endive overview says later Endive versions add only additive changes) or who move to the SDK majors that pin it,
# released 2026-09-30: stripe-python 16.0.0, stripe-node 23.0.0, stripe-go v87.0.0, stripe-ruby 20.0.0, stripe-java 34.0.0, stripe-dotnet 53.0.0, stripe-php 22.0.0.
# repo_context gate (plain substring, lowercased, searched in code and dependency manifests): ".endive" catches the version string in code/config;
# the SDK majors are matched in their manifest shapes ("stripe==16", '"stripe": "^23', "stripe-go/v87", "stripe (20." in Gemfile.lock,
# "stripe-java:34." in Gradle, 'Stripe.net" Version="53' in .csproj) because bare "16.0.0"/"23.0.0" would match any package at that version.
# Misses floating ranges such as "stripe>=15", and accounts whose default API version was upgraded in Workbench with no version in code.
# context needs a file that mentions both stripe and reject (Account reject); the quoted value forms don't match refund/dispute 'fraudulent'.
# The page also says typed SDKs (Python, Java, Node.js) change reason from string to enum; that compile-time change has no single signature and is only in the detail.
id: stripe-2026-09-30-account-reject-reason-fraud-removed
vendor: Stripe
surface: 'Stripe API 2026-09-30.endive — Account reject reason: fraud value removed'
kind: rest
severity: breaking
effective: '2026-09-30'
summary: When you upgrade to Stripe API version 2026-09-30.endive (or an SDK major that pins it), rejecting a connected account with reason fraud returns an HTTP 400 error
detail: The generic fraud value is replaced by fraud_payment_method_casher, fraud_payment_method_tester, fraud_no_intent_to_fulfill and fraud_other; terms_of_service and other still work and credit is new. In the Python, Java and Node.js SDKs the reason parameter also changes from a string to an enum that doesn't include fraud. The page lists no SDK type change for Ruby, PHP, Go or .NET, but those SDKs' new majors pin 2026-09-30.endive, so the REST change still applies. Integrations on earlier API and SDK versions can keep passing fraud.
