summary: Google will shut down the Gemini API Deep Research agent deep-research-pro-preview-12-2025 on October 23, 2026.
detail: Google's deprecations page lists the managed agent deep-research-pro-preview-12-2025 (released December 11, 2025) with an October 23, 2026 shutdown date and deep-research-preview-04-2026 as the recommended replacement. The October 8, 2026 changelog entry announces the deprecation and says to migrate to deep-research-preview-04-2026 (designed for speed and efficiency) or deep-research-max-preview-04-2026 (maximum comprehensiveness) by updating the agent parameter in interactions.create requests.
