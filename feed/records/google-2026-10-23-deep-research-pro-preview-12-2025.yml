fix_hint: Change the agent parameter in your interactions.create requests from deep-research-pro-preview-12-2025 to deep-research-preview-04-2026 (Google's listed replacement, designed for speed and streaming to a client UI) or deep-research-max-preview-04-2026 (maximum comprehensiveness). Both are preview agents; re-test research outputs after switching.
