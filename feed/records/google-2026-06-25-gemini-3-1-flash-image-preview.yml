summary: The Gemini 3 image preview models gemini-3.1-flash-image-preview and gemini-3-pro-image-preview were shut down on the Gemini API on June 25, 2026. Google now lists gemini-nano-banana-2.1 and gemini-3-pro-image as their replacements.
detail: Google announced the deprecation on May 28, 2026, the same day it released the GA models gemini-3.1-flash-image and gemini-3-pro-image. The deprecations page lists June 25, 2026 as the shutdown date for both previews. It now names gemini-nano-banana-2.1 as the replacement for gemini-3.1-flash-image-preview and gemini-3-pro-image for gemini-3-pro-image-preview. The October 6, 2026 release notes deprecate gemini-3.1-flash-image (no shutdown date announced) in favor of gemini-nano-banana-2.1. The release notes don't separately confirm that the preview shutdown happened.
