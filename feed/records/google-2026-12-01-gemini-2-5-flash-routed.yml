fix_hint: Before December 1, 2026, change the model string from gemini-2.5-flash to gemini-3.5-flash-lite, as Google directs, and follow its migration guide. Replace thinking_budget with thinking_level, remove temperature, top_p, top_k and candidate_count, stop prefilling model turns (those requests return HTTP 400), and re-test function calling. Re-run your evals on quality and cost, since a different model will answer. gemini-2.5-flash-lite is not deprecated if you need to stay on a 2.5 model.
