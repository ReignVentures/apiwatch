fix_hint: "Switch to the V2 names the changelog gives: listLoomVideos and listLoomVideosSharedWithMe → listLoomObjects; getLoomVideo → getLoomObjectsContent; getLoomVideoComments and getLoomMeetingActionItems → getLoomObjectsContent with the applicable content expansion; createLoomVideoComment and createLoomVideoReaction → addLoomInteraction; updateLoomVideoTitle → updateLoomObjectMetadata; updateLoomVideoPermissions → updateLoomObjectVisibility; shareLoomVideo → shareLoomObject; createLoomVideoUpload → createLoomObjectUpload; publishLoomVideo → publishLoomObject; listLoomFolders → listLoomObjectFolders; createLoomFolder → createLoomObjectFolder; moveLoomVideoToFolder → moveLoomObjectToFolder. Keep getLoomVideoDownloadUrl and recoverLoomVideo. Because rollout is per cohort, read tools/list (and discover, for operations called through execute) at startup and use whichever set the server advertises."
