# Promoted from feed/drafts (written by an author agent from a changelog lead (apiwatch watch)) after independent review (docs/REVIEW.md) on 2026-10-02: fix. Defaults and silent severity match; added the automatic-manual-entry error case the source states; summary softened.
# Scope: GA API version 2026-09-30.endive (changelog section "2026-09-30.endive"). Bites only callers who send Stripe-Version 2026-09-30.endive
# (or a later .endive version: the Endive overview says later Endive versions add only additive changes) or who move to the SDK majors that pin it,
# released 2026-09-30: stripe-python 16.0.0, stripe-node 23.0.0, stripe-go v87.0.0, stripe-ruby 20.0.0, stripe-java 34.0.0, stripe-dotnet 53.0.0, stripe-php 22.0.0.
# repo_context gate (plain substring, lowercased, searched in code and dependency manifests): ".endive" catches the version string in code/config;
# the SDK majors are matched in their manifest shapes ("stripe==16", '"stripe": "^23', "stripe-go/v87", "stripe (20." in Gemfile.lock,
# "stripe-java:34." in Gradle, 'Stripe.net" Version="53' in .csproj) because bare "16.0.0"/"23.0.0" would match any package at that version.
# floating ranges such as "stripe>=15", and accounts whose default API version was upgraded in Workbench with no version in code.
# Silent: same request, different Session. Signatures are the Session create call in each SDK plus the REST path; a hit means the defaults apply unless every listed parameter is set explicitly.
id: stripe-2026-09-30-financial-connections-session-defaults
vendor: Stripe
surface: Stripe API 2026-09-30.endive — Financial Connections Session create defaults (limits.accounts, manual_entry.mode, filters.*)
kind: rest
severity: silent
effective: '2026-09-30'
summary: When you upgrade to Stripe API version 2026-09-30.endive (or an SDK major that pins it), Financial Connections Sessions created without explicit limits, filters or manual_entry settings use new standard defaults, which can change what users can link
detail: limits[accounts] defaults to no maximum, manual_entry[mode] to disabled, filters[require_payment_method_support] to none, filters[account_subcategories] to all supported subcategories, and filters[country] to the requesting merchant's country (otherwise the US). The same request can now let users link more accounts and account types, no longer guarantee that linked accounts support payments, disable manual entry, or use a different country. Automatic manual entry isn't supported when require_payment_method_support is none.
