# Authored 2026-10-11 by an author agent from a changelog lead (Gemini API changelog, October 8, 2026), using primary
# sources only (Markdown twins, fetched 2026-10-11): the Gemini API changelog, the deprecations page, and the
# "What's new in Gemini 3.5" guide. Independent review (docs/REVIEW.md) on 2026-10-11: pass, no corrections.
# Severity: silent. Since October 8, 2026, requests naming gemini-3.5-flash do not fail; Google automatically routes
# them to gemini-3.6-flash, so callers get a different model's results (and its token usage and output pricing)
# without an error. No shutdown date is announced (deprecations page: "No shutdown date announced"), so it is not
# breaking. It is also labelled deprecated, but "deprecation" (still works) understates it: the named model is no
# longer what serves the request. The reviewer agreed: silent.
# Repaired 2026-10-13: Google reworded the changelog entry ("API requests to gemini-3.5-flash are automatically
# routed to gemini-3.6-flash"; no longer selectable in Google AI Studio) and the deprecations row now shows the
# shutdown date as N/A with "the endpoint is not shutting down". Evidence and detail updated to the current text.
# Re-review 2026-10-13 by a fresh reviewer agent: fix. fix_hint no longer calls gemini-3.8-flash the newest Flash model
# (the changelog says most intelligent); the deprecations row was added as evidence.
# Exclude: gemini-3.5-flash-lite is a live, separate model (deprecations page lists no shutdown date or replacement).
# No other gemini-3.5-flash-* ids appear on these pages. gemini-flash-latest pointed at gemini-3.5-flash on May 19,
# 2026, but no source says what it points at now, so it is not an alias here.
id: google-2026-10-08-gemini-3-5-flash-routed
vendor: Google
surface: Gemini API model gemini-3.5-flash
kind: model
severity: silent
effective: '2026-10-08'
summary: Since October 8, 2026, Google routes Gemini API requests for the deprecated gemini-3.5-flash to gemini-3.6-flash.
detail: The October 8, 2026 Gemini API changelog says gemini-3.5-flash is deprecated and has been replaced by gemini-3.6-flash, that it is no longer available to select in Google AI Studio, and that API requests to gemini-3.5-flash are automatically routed to gemini-3.6-flash. Requests keep working, but they are served by a different model. The deprecations page lists gemini-3.5-flash (released May 19, 2026) with shutdown date N/A and gemini-3.6-flash as the replacement, and says the endpoint is not shutting down. Google's Gemini 3.5 guide describes gemini-3.6-flash as a direct replacement with reduced token usage and lower output pricing.
signatures:
- gemini-3.5-flash
