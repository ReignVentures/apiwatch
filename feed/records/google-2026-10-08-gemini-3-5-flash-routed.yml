evidence:
- October 8, 2026
- Gemini 3.5 Flash deprecation
- API requests to `gemini-3.5-flash` are automatically routed to `gemini-3.6-flash`
- url: https://ai.google.dev/gemini-api/docs/deprecations.md.txt
  text: 'gemini-3.5-flash | May 19, 2026 | N/A | gemini-3.6-flash'
- url: https://ai.google.dev/gemini-api/docs/whats-new-gemini-3.5.md.txt
  text: Direct replacement for gemini-3.5-flash with reduced token usage
fix_hint: Change the model string from gemini-3.5-flash to gemini-3.6-flash (the model already serving your requests) or gemini-3.8-flash, which the changelog also names. Re-run your evals on outputs, token usage and cost, since results already come from gemini-3.6-flash.
