# Promoted from feed/drafts (written by an author agent from a changelog lead (apiwatch watch)) after independent review (docs/REVIEW.md) on 2026-10-02: fix. Accurate; scoping works; gate fixed; canonical gates.
# Scope: GA API version 2026-09-30.endive (changelog section "2026-09-30.endive"). Bites only callers who send Stripe-Version 2026-09-30.endive
# (or a later .endive version: the Endive overview says later Endive versions add only additive changes) or who move to the SDK majors that pin it,
# released 2026-09-30: stripe-python 16.0.0, stripe-node 23.0.0, stripe-go v87.0.0, stripe-ruby 20.0.0, stripe-java 34.0.0, stripe-dotnet 53.0.0, stripe-php 22.0.0.
# repo_context gate (plain substring, lowercased, searched in code and dependency manifests): ".endive" catches the version string in code/config;
# the SDK majors are matched in their manifest shapes ("stripe==16", '"stripe": "^23', "stripe-go/v87", "stripe (20." in Gemfile.lock,
# "stripe-java:34." in Gradle, 'Stripe.net" Version="53' in .csproj) because bare "16.0.0"/"23.0.0" would match any package at that version.
# floating ranges such as "stripe>=15", and accounts whose default API version was upgraded in Workbench with no version in code.
# configurations is generic, so signatures are key/argument forms and the file must also mention account_onboarding or account_update (v2 Account Link use cases).
id: stripe-2026-09-30-v2-account-links-configurations-removed
vendor: Stripe
surface: 'Stripe API 2026-09-30.endive — v2 Account Links create: use_case.account_onboarding/account_update configurations removed'
kind: rest
severity: breaking
effective: '2026-09-30'
summary: When you upgrade to Stripe API version 2026-09-30.endive (or an SDK major that pins it), creating a v2 Account Link with a configurations parameter in use_case.account_onboarding or use_case.account_update fails
detail: Stripe now determines which configurations (such as customer, merchant or recipient) need onboarding, so the parameter was removed from both use cases on v2 Account Link create and from the Account Link object. Requests that include configurations return an error on 2026-09-30.endive or later.
