summary: When you upgrade to Stripe API version 2026-09-30.endive (or an SDK major that pins it), accounts your platform rejected report rejected.platform_fraud, rejected.platform_terms_of_service or rejected.platform_other instead of rejected.fraud, rejected.terms_of_service or rejected.other
detail: The change applies to requirements.disabled_reason and future_requirements.disabled_reason on v1 Accounts and in account.updated events. Code that compares against the old values to spot platform rejections stops matching without an error; the new values let you tell platform rejections from Stripe rejections.
