- dep:npm:@anthropic-ai/sdk@1.
- dep:rubygems:anthropic@2.
- dep:packagist:anthropic-ai/sdk@1.
- anthropic-sdk-go/v2
- anthropic-cli/v2
- com.anthropic:anthropic-java:3.
- include="anthropic" version="13.
- [anthropic-version, '2026-10-21']
source_url: https://platform.claude.com/docs/en/api/migration-2026-10-21.md
verified: true
verified_by: claude
verified_on: '2026-10-23'
evidence:
- sends `temperature`, `top_p`, or `top_k` returns a 400 error
- a non-empty `citations` array in a `user` message
- places a `document` block directly in an `assistant` message
- url: https://platform.claude.com/docs/en/release-notes/overview.md
  text: We've released API version `2026-10-21`
- url: https://platform.claude.com/docs/en/release-notes/overview.md
  text: October 21, 2026
fix_hint: 'Before moving to 2026-10-21 (or the new SDK major): remove temperature, top_p and top_k from Messages, token-counting and batch requests, including any extra_body or raw JSON that still sends them; a request that needs a non-default value can stay on 2023-06-01, since nothing replaces it on 2026-10-21. Move document blocks out of assistant messages into user messages. Remove citations from text blocks (and search_result content) in user messages; assistant citations and "citations": {"enabled": true} can stay. On Bedrock, switch a call to a Claude 4.7 or later model before moving it to 2026-10-21, or keep the version it sends today. Release the upgrade together with these fixes.'
