summary: From September 30, 2026 the Conference list endpoint will return only in-progress conferences when no status filter is given
detail: Announced September 23, 2026. Without a status filter the endpoint currently returns conferences of every status (init, in-progress, completed); from September 30 it will return only in-progress ones. Each call will then return either in-progress or completed conferences, so applications that retrieve completed conferences must add status=completed, and those that need both must make two requests.
