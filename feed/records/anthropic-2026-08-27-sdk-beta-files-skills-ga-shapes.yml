fix_hint: Before upgrading, switch to client.files / client.skills, replace before_id/after_id loops with page/next_page, rename display_title to display_name and latest_version to latest_version_id, store skver_ version ids instead of epoch versions, read source.type, and add your own guard before skills.delete(); or stay on an earlier SDK release until migrated.
