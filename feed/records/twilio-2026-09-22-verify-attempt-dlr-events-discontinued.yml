summary: Verify Events' Attempt DLR event types were discontinued after September 22, 2026 10:00PM UTC; Twilio may stop sending them even to existing subscriptions
detail: Twilio discontinued the five com.twilio.accountsecurity.verify.attempt-dlr.* event types (delivered, failed, read, sent, undelivered) after September 22, 2026 10:00PM UTC. From then on Twilio may stop sending these events even to existing subscriptions; other event types in the same subscription keep arriving normally. The event-type docs now mark each one as discontinued.
