# Promoted from feed/drafts (written by an author agent from a changelog lead (apiwatch watch)) after independent review (docs/REVIEW.md) on 2026-09-24: fix. Summary says public preview plainly; industry metadata is itself a public-preview feature (evidence added); added Taxes (Go/.NET) and CamelCase context names. Context terms are preview-only, so GA integrations can't be flagged.
# Scope: PUBLIC PREVIEW API version 2026-07-29.preview only. Industry metadata payment_details (car_rental_data, lodging_data, flight_data) is not in the GA SDKs
# (stripe-node v22.6.0 PaymentIntents.ts has no car_rental_data). Removal ships in stripe-python v15.5.0b1 / stripe-node v22.5.0-beta.1.
# "taxes" is generic, so context limits it to files that build industry metadata.
# 2026-09-24 attribution review: bare `taxes` replaced with key and field forms, so migrated code that reads a local `taxes` value isn't flagged.
# 2026-09-24 scope: each industry field now needs `stripe` in the same file too (AND groups), so non-Stripe flight/travel code isn't flagged.
id: stripe-2026-07-29-industry-metadata-taxes-renamed
vendor: Stripe
surface: Stripe API 2026-07-29.preview (public preview) — payment_details.{car_rental_data,lodging_data,flight_data}.total.tax.taxes renamed to tax_items (PaymentIntents, Charges)
kind: rest
severity: breaking
effective: '2026-07-29'
summary: In Stripe's public preview API version 2026-07-29.preview, total.tax.taxes in car rental, lodging and flight payment_details was renamed to tax_items; sending taxes returns a parameter_unknown error
detail: Industry metadata payment_details is a public preview feature that needs the 2026-07-29.preview version header or a later preview version. On those versions the API no longer accepts taxes. On older versions taxes was converted to tax_items. The rename covers car rental, lodging and flight payment_details on PaymentIntent create, update, confirm and capture, and on Charge update and capture.
