fix_hint: Before January 11, 2027, send these EU data residency requests with Standard processing (service_tier "default") on the same models, or move them to the GPT-6.2 model family (gpt-6.2-astra or gpt-6.2-sol), which OpenAI lists as supporting EU data residency with Fast mode. Also check the project's Service Tier setting, since requests that omit service_tier or send auto use it. Re-test on your own workload before switching models.
