detail: "Deprecated in September 2025 and removed from the API on May 12, 2026, with the GA Realtime API as the replacement. OpenAI's migration notes list the main differences: drop the OpenAI-Beta: realtime=v1 header, create browser or mobile credentials with POST /v1/realtime/client_secrets, use /v1/realtime/calls for WebRTC, and update session and event shapes (set session.type, move output audio settings under session.audio.output, and use event names such as response.output_audio.delta)."
