detail: "OpenAI's deprecations page lists OpenAI-Beta: realtime=v1 under Past deprecations with a May 12, 2026 shutdown date, a September 15, 2025 notice date, and the Realtime API migration guide as the replacement. The Realtime guide's Beta to GA migration section lists the main differences: remove the OpenAI-Beta: realtime=v1 header when calling the GA interface, create browser or mobile credentials with POST /v1/realtime/client_secrets, use /v1/realtime/calls for WebRTC, and update session and event shapes (set session.type, move output audio settings under session.audio.output, and use event names such as response.output_audio.delta)."
