# Promoted from feed/drafts (written by an author agent from a changelog lead (apiwatch watch)) after independent review (docs/REVIEW.md) on 2026-10-02: fix. Claims match the what's-new page, migration guide and release notes. Added quote/spacing/SDK variants and computer_20250124 (rejected on every platform); kind rest so hit tiers don't demote request parameters; evidence for budget_tokens.
# Lead: GitHub issue #4 (release notes, September 28, 2026). Bites only when code moves to claude-sonnet-5-5, so every signature is gated on the new model id being in the same file (context).
# Covered (three of the five breaking changes, plus manual budgets): thinking {"type": "disabled"}; forced tool_choice any/tool; computer_20251124; budget_tokens.
# Not covered (no honest signature): thinking blocks tied to the model/conversation (append-only history), advisor pairings (the rejected advisor ids include claude-sonnet-5, which would match every claude-sonnet-5-5 file).
# SDK type names: ThinkingConfigDisabled(Param), ToolChoiceTool, ToolChoiceParamOfTool are in the migration guide; ToolChoiceAnyParam / ToolChoiceToolParam are the anthropic-sdk-python type names (src/anthropic/types/tool_choice_any_param.py).
# Raw request forms are matched with the spacing the docs use (JSON/Python '"type": "x"', TypeScript 'type: "x"', PHP "'type' => 'x'"); other spacings are missed.
# Known false positives: Amazon Bedrock still accepts computer_20251124 on Sonnet 5.5 (anthropic.claude-sonnet-5-5 matches the context); a file that names claude-sonnet-5-5 but sends these shapes to another model.
id: anthropic-2026-09-28-sonnet-5-5-rejected-request-shapes
vendor: Anthropic
surface: Messages API on claude-sonnet-5-5 — thinking disabled and budget_tokens, forced tool_choice (any/tool), computer_20251124 and computer_20250124
kind: rest
severity: breaking
effective: '2026-09-28'
summary: From its launch on September 28, 2026, Claude Sonnet 5.5 rejects with a 400 any request that sends thinking type disabled, manual budget_tokens, tool_choice any or tool, or the computer_20250124 tool, and on the Claude API and Google Cloud also the computer_20251124 tool
detail: 'On claude-sonnet-5-5, thinking {"type": "disabled"} and manual budgets ({"type": "enabled", "budget_tokens": N}) return a 400; {"type": "between_tools"} turns off up-front thinking at low, medium or high effort. tool_choice {"type": "any"} or {"type": "tool"} returns a 400 invalid_request_error, including on the token counting endpoint. computer_20250124 is not accepted on any platform, and computer_20251124 returns a 400 on the Claude API and Google Cloud, which require the computer_toolset_20260801 toolset, but is still accepted on Amazon Bedrock.'
