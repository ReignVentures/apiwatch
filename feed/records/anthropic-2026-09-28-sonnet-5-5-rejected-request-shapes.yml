fix_hint: 'Before moving a request to claude-sonnet-5-5: replace thinking {"type": "disabled"} with {"type": "between_tools"} (low, medium or high effort only), or use adaptive thinking; drop budget_tokens and set output_config.effort instead; replace tool_choice any/tool with {"type": "auto"} plus strict: true on the tool and say in the prompt when to call it (on Amazon Bedrock, where strict isn''t available, validate the tool input yourself); on the Claude API and Google Cloud move computer use to {"type": "computer_toolset_20260801"} and update the agent loop, and on Bedrock use computer_20251124. Also keep conversation history append-only and use an advisor Claude Sonnet 5.5 accepts.'
