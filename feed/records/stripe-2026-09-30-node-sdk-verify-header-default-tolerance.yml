fix_hint: Before moving to stripe-node 23, find verifyHeader/verifyHeaderAsync calls that omit the tolerance argument. Keep the new default for webhooks verified as they arrive. Pass 0 only where you verify old payloads on purpose (test fixtures, replays, offline processing). Calls that already pass a tolerance are unaffected. Also review any constructEvent call that passes 0, since that now turns the timestamp check off.
