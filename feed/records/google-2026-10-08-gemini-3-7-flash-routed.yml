- October 8, 2026
- url: https://ai.google.dev/gemini-api/docs/deprecations.md.txt
  text: 'gemini-3.7-flash | August 13, 2026 | No shutdown date announced'
fix_hint: Change the model string from gemini-3.7-flash to gemini-3.8-flash, as Google directs, and review the Gemini 3.8 Flash guide. Your requests are already served by gemini-3.8-flash, so re-check output quality, latency and cost on your evals.
