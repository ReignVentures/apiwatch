id: github-2026-01-26-mcp-actions-projects-consolidation
vendor: GitHub MCP Server
surface: Actions and Projects toolsets — 25 tools folded into actions_list / actions_get / actions_run_trigger / projects_list / projects_get / projects_write
kind: mcp
severity: breaking
effective: '2026-01-26'
summary: GitHub MCP server replaced its individual Actions and Projects tools with consolidated read/write tools; old names only survive as config aliases
detail: v0.30.0 made the consolidated tools the default, and v0.31.0 (Feb 19) deleted the old implementations. Old names in --tools flags or X-MCP-Tools headers silently resolve to the consolidated tool, so the config keeps working but registers a tool with a different schema. The renaming guide describes the aliases for server configuration (--tools, X-MCP-Tools). Agents or code that call the old tool names directly, or send the old argument shapes, break.
