id: stripe-2026-09-30-financial-connections-countries-renamed
vendor: Stripe
surface: Stripe API 2026-09-30.endive — Financial Connections Session filters.countries renamed to filters.country
kind: rest
severity: breaking
effective: '2026-09-30'
summary: When you upgrade to Stripe API version 2026-09-30.endive (or an SDK major that pins it), Financial Connections Session create no longer accepts filters.countries; use filters.country with a single country code
detail: The parameter is renamed and changes from an array of strings to one string, and countries is also removed from the Session object's filters. Passing the old name or an array value returns an error.
