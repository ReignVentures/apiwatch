summary: In Stripe.js Endive (js.stripe.com/endive or @stripe/stripe-js 10), setting paymentMethodTypes when creating Elements without an intent or in elements.update() throws an integration error
detail: Stripe.js throws and won't create or update the Elements instance when paymentMethodTypes is set; @stripe/stripe-js 10.0.0 also removes the option from its types. Stripe.js versions through Dahlia still support it.
