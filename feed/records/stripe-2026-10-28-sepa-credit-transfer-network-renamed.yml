summary: 'In Stripe''s public preview API version 2026-10-28.preview, the sepa_credit_transfer network value on v2 Financial Addresses and Received Credits is renamed to sepa; requests that send the old value fail and comparisons against it stop matching'
detail: 'This applies only to callers on the public preview version 2026-10-28.preview, or on the preview SDKs that pin it (stripe-python 16.2.0b1, stripe-node 23.2.0-beta.1), who use v2 Financial Addresses or Received Credits. Stripe says the sepa_credit_transfer value is no longer supported. The rename applies to both request parameters and response values, so code that sets or reads the network property must use sepa.'
