# Written by an author agent from changelog lead #42 (apiwatch watch), from the primary source page only. Independent review (docs/REVIEW.md) 2026-10-31 by a fresh agent: fix (scope only), applied.
# Scope: PUBLIC PREVIEW API version 2026-10-28.preview (v2 money management Financial Addresses and Received Credits).
# sepa_credit_transfer is also a GA v1 value (Sources, etc.), so context needs a v2 Financial Address or Received Credit reference plus money management in the same file,
# and repo_context gates on a preview API version string or the preview SDK pins (stripe-python 16.2.0b*, stripe-node 23.2.0-beta*, both pinned to 2026-10-28.preview per their beta CHANGELOGs). The page lists no SDK constant for the old value, so only the literal string is a signature.
# The same page adds eur as a Financial Address currency; that part is additive and not recorded.
# Also matches the Credit a Financial Address test helper (the network parameter), which SDK code may call without a money_management reference.
id: stripe-2026-10-28-sepa-credit-transfer-network-renamed
vendor: Stripe
