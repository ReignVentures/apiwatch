summary: Google shut down gemini-omni-flash-preview on the Gemini API on October 22, 2026, after deprecating it on September 30, 2026; move to gemini-omni-1.2-flash.
detail: The August 27, 2026 release notes announced gemini-omni-1.1-flash as GA and said the existing gemini-omni-flash-preview endpoint will be deprecated on September 30, 2026. The deprecations page lists gemini-omni-flash-preview among its already-shut-down Deprecated models with an October 22, 2026 shutdown date and gemini-omni-1.2-flash as the recommended replacement, and the Gemini Omni Flash model page lists it as shut down. The release notes don't separately announce the shutdown. gemini-omni-1.1-flash is itself routed to gemini-omni-1.2-flash from December 3, 2026.
