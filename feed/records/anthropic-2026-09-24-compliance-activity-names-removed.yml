- the `filename` and `title` fields on these activities are always `null`
- including on activities recorded before that date
- read:compliance_user_data
- url: https://platform.claude.com/docs/en/release-notes/overview.md
  text: no longer returns file names, project document names, or artifact titles
fix_hint: Stop reading names from activity filename/title. Look each one up by the activity's claude_file_*, claude_proj_doc_* or claude_artifact_version_* ID through the matching Compliance API file, project document or artifact metadata endpoint, using a key with read:compliance_user_data. Handle items that are deleted or have no ID.
