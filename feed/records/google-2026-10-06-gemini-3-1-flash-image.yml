summary: Google deprecated the Gemini API image model gemini-3.1-flash-image (Nano Banana 2) on October 6, 2026, with no shutdown date announced, and tells callers to migrate to gemini-nano-banana-2.1.
detail: The October 6, 2026 Gemini API release notes say the gemini-3.1-flash-image model is deprecated (no shutdown date announced) and to migrate to gemini-nano-banana-2.1, which went GA the same day as an update to Nano Banana 2. The deprecations page lists gemini-3.1-flash-image (released May 28, 2026) with "No shutdown date announced" and gemini-nano-banana-2.1 as the recommended replacement. Calls still work for now; Google says shutdown dates on that page are the earliest possible and that it will give advance notice. This record covers only the GA id, not gemini-3.1-flash-image-preview (shut down June 25, 2026, separate record) or gemini-3.1-flash-lite-image.
