  text: no longer pass `payment_method_types` when you create a Checkout Session
- url: https://raw.githubusercontent.com/stripe/stripe-node/master/CHANGELOG.md
  text: Remove support for `payment_method_types` on `Checkout.SessionCreateParams`
- url: https://raw.githubusercontent.com/stripe/stripe-python/master/CHANGELOG.md
  text: This release changes the pinned API version to `2026-09-30.endive`.
fix_hint: Before moving to 2026-09-30.endive, stop sending payment_method_types on Checkout Session create and on PaymentIntent and SetupIntent writes. Use dynamic payment methods managed in the Dashboard, excluded_payment_method_types to remove types, or allowed_payment_method_types to list the types you accept (incompatible types are filtered out instead of erroring).
