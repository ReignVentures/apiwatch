# Promoted from feed/drafts (written by an author agent from a changelog lead (apiwatch watch)) after independent review (docs/REVIEW.md) on 2026-10-02: fix. Scope matches both GA pages (Checkout create; PI create/update/confirm, SI create/update). Context needs an intent or Checkout reference so Invoice/PaymentLink payment_method_types isn't flagged; Java builders added; gates widened. GA release of the Aug 26 preview change (allowlisted pair).
# Scope: GA API version 2026-09-30.endive (changelog section "2026-09-30.endive"). Bites only callers who send Stripe-Version 2026-09-30.endive
# (or a later .endive version: the Endive overview says later Endive versions add only additive changes) or who move to the SDK majors that pin it,
# released 2026-09-30: stripe-python 16.0.0, stripe-node 23.0.0, stripe-go v87.0.0, stripe-ruby 20.0.0, stripe-java 34.0.0, stripe-dotnet 53.0.0, stripe-php 22.0.0.
# repo_context gate (plain substring, lowercased, searched in code and dependency manifests): ".endive" catches the version string in code/config;
# the SDK majors are matched in their manifest shapes ("stripe==16", '"stripe": "^23', "stripe-go/v87", "stripe (20." in Gemfile.lock,
# "stripe-java:34." in Gradle, 'Stripe.net" Version="53' in .csproj) because bare "16.0.0"/"23.0.0" would match any package at that version.
# floating ranges such as "stripe>=15", and accounts whose default API version was upgraded in Workbench with no version in code.
# GA counterpart of the preview record stripe-2026-08-26-intents-payment-method-types-removed (2026-08-26.preview, PaymentIntents/SetupIntents only).
# Same signatures, separate change (different version, date and gate): allowlist the pair in tests/test_records.py SAME_SURFACE.
# One record covers two endive changelog entries (Checkout Sessions, and PaymentIntents/SetupIntents): same parameter, same version, same SDK releases, same fix,
# and a line of code can't be told apart; two records would report every hit twice and need allowlisting against each other too.
# The PI/SI page's Impact paragraph still says "before upgrading to API version 2026-08-26.preview" (copied from the preview entry); evidence avoids it.
id: stripe-2026-09-30-payment-method-types-removed
vendor: Stripe
surface: Stripe API 2026-09-30.endive — payment_method_types on Checkout Session create, PaymentIntent create/update/confirm and SetupIntent create/update
kind: rest
severity: breaking
effective: '2026-09-30'
summary: When you upgrade to Stripe API version 2026-09-30.endive (or an SDK major that pins it), passing payment_method_types when creating a Checkout Session, or when creating, updating or confirming a PaymentIntent or creating or updating a SetupIntent, returns a 400 error
detail: The PaymentIntent and SetupIntent part first shipped in the 2026-08-26.preview public preview; this is its GA release, with Checkout Sessions added. The SDKs that pin 2026-09-30.endive (stripe-python 16.0.0, stripe-node 23.0.0, stripe-go v87.0.0, stripe-ruby 20.0.0, stripe-java 34.0.0, stripe-dotnet 53.0.0, stripe-php 22.0.0) drop the parameter from these create, update and confirm params. payment_method_types stays readable on the returned objects.
