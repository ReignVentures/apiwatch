# Promoted from feed/drafts (written by an author agent from a changelog lead (apiwatch watch)) after independent review (docs/REVIEW.md) on 2026-10-02: fix. Facts correct; added object-form address fields; context also accepts react-stripe-js/checkout imports; summary limited to required data; fix adds the automatic-tax caveat; gate widened.
# Scope: Stripe.js Endive (js.stripe.com/endive, or @stripe/stripe-js 10.x, which loads Endive: v10.0.0 release notes "Removed ... for Endive";
# the versioning doc says each @stripe/stripe-js major consumes one fixed Stripe.js version). Stripe.js through Dahlia (v3, @stripe/stripe-js <= 9) is unaffected.
# repo_context matches the script URL or the @stripe/stripe-js 10 dependency in package.json / yarn.lock / pnpm-lock.yaml (package-lock.json puts name and version on separate lines, so it's missed).
# Only Elements with Checkout Sessions (Custom Checkout) changes: context needs billingDetails plus a Custom Checkout marker
# (initCheckout*, useCheckout, CheckoutProvider/CheckoutElementsProvider, createPaymentElement). Elements with PaymentIntents is unaffected.
id: stripe-2026-09-30-stripe-js-checkout-billing-details-required
vendor: Stripe
surface: 'Stripe.js Endive — Elements with Checkout Sessions: Payment Element fields.billingDetails ''never'' and checkout.confirm()'
kind: sdk
severity: breaking
effective: '2026-09-30'
summary: In Stripe.js Endive, Elements with Checkout Sessions integrations that set a Payment Element billing field to never must supply any required billing data for it another way, or checkout.confirm() throws an integration error
detail: Previously checkout.confirm() could succeed even when a required billing field set to never wasn't provided through another source. Optional fields such as address.line2 are exempt. Previous Stripe.js major versions keep the earlier behavior.
