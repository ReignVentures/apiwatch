evidence:
- value to `never` without providing the corresponding required data
- these integrations fail at confirmation with an integration error
- Previous Stripe.js major versions retain the earlier behavior.
- don't pass billingAddress to checkout.confirm()
- url: https://docs.stripe.com/sdks/stripejs-versioning.md
  text: each major version of Stripe.js consumes a specific fixed version
fix_hint: 'Before moving to Stripe.js Endive, supply every required billing field you set to never: call updateBillingAddress, updateEmail or updatePhoneNumber, pass billingAddress, email or phoneNumber to checkout.confirm(), or use the Billing Address Element. With automatic tax, provide the address through the Address Element or updateBillingAddress rather than checkout.confirm(). Or set only the fields you collect yourself to never and leave the rest auto.'
