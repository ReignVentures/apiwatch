summary: Google deprecated the temperature, top_p and top_k sampling parameters in the Gemini API on July 21, 2026
detail: The July 21, 2026 Gemini API changelog marks temperature, top_p and top_k as deprecated. The Gemini 3.x guides say they are no longer recommended for any Gemini 3.x model and to remove them from all requests. No removal date or error behavior is announced, and the API reference still documents temperature as optional.
