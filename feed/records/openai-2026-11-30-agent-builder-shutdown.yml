summary: OpenAI shuts down Agent Builder on November 30, 2026; ChatKit sessions that run an Agent Builder-hosted workflow are supported only during the transition window, so move to an advanced ChatKit integration with your own agent (Agents SDK) before then
detail: "Notice date June 3, 2026. OpenAI's deprecations page lists Agent Builder as Deprecated with a November 30, 2026 shutdown date and recommends the Agents SDK or ChatGPT Workspace Agents, with a migration guide; it adds that ChatKit remains available. The Agent Builder guide says existing users can keep using it during the transition window and that the product is scheduled to shut down on November 30, 2026. Code meets Agent Builder through its published workflows: the ChatKit guide's hosted path creates a ChatKit session at /v1/chatkit/sessions with the workflow ID, and says existing users can keep using that hosted workflow during the Agent Builder transition window; for new apps or migration it points to the advanced ChatKit integration with your own server-side agent implementation. Every session-create call must name a workflow (workflow is a required parameter), and the advanced-integration guide says Agent Builder-hosted ChatKit workflows are in a transition window. The sources don't say what the sessions endpoint returns after November 30 or that the endpoint itself is removed; they limit hosted-workflow use to the window that ends with the shutdown. The migration guide exports a workflow as Agents SDK code (TypeScript or Python) from Agent Builder's Code dialog; it doesn't convert the workflow graph or guarantee every behavior transfers unchanged."
