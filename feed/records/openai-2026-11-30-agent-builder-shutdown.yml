fix_hint: Before November 30, 2026, open each workflow in Agent Builder and export it from Code > Agents SDK (TypeScript or Python). Run it with the Agents SDK behind your own server and connect ChatKit through the advanced ChatKit integration instead of a hosted workflow session, or recreate it as a ChatGPT Workspace Agent. The export doesn't carry every behavior over unchanged, so test control flow, tools and permissions against the original workflow.
