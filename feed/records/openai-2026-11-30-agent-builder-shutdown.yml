# Written by Claude on 2026-11-19 from the deprecations page (Feature and endpoint deprecations row, notice Jun 3, 2026), the Agent Builder guide, the Migrate from Agent Builder guide, the ChatKit guide and the ChatKit sessions API reference (POST /chatkit/sessions; Python client.beta.chatkit.sessions.create).
# Agent Builder itself is a visual canvas with no API of its own. Its code-level footprint is a published workflow (wf_... id) passed to a hosted ChatKit session: the ChatKit guide's "Existing hosted workflow" path creates a session at /v1/chatkit/sessions with workflow: {id}, and the sessions reference marks workflow as the parameter that powers the session. The custom (self-hosted) ChatKit integration doesn't call that endpoint. So the signatures are the session-create path and SDK call, the narrowest identifiers a hosted-workflow integration always has.
# Uncertain, keep in mind at review: the sources say the hosted workflow can be used "during the Agent Builder transition window" and that Agent Builder is scheduled to shut down on November 30, 2026, and that ChatKit remains available; none says in so many words what /v1/chatkit/sessions returns for a workflow id after that date. The detail says so. wf_ ids can't be a signature (the matcher needs a token boundary after "wf_"). Go/Java forms (Beta.ChatKit.Sessions.New, ChatSessionWorkflowParam) are not signed.
# Independent review (docs/REVIEW.md) on 2026-11-19: fix: breaking kept. Every POST /v1/chatkit/sessions call must name a workflow (workflow is a required body parameter; the reference calls it the "Workflow that powers the session"), workflows are Agent Builder objects, and the ChatKit, advanced-integration and Agent Builder guides all limit hosted-workflow use to the transition window that ends with the November 30 shutdown and tell callers to migrate before it. That is a dated retirement of what the call depends on, within 180 days. The sources still don't say what the endpoint returns afterwards or that the endpoint itself is removed, so the detail now says exactly that, and the summary names the ChatKit-specific path (advanced integration with your own agent, e.g. the Agents SDK) instead of implying ChatKit callers move to Workspace Agents. Custom (self-hosted) ChatKit integrations don't call the sessions endpoint (custom-chatkit guide), so no false hits on the path that stays. Signatures confirmed in the sessions reference (Python client.beta.chatkit.sessions.create).
