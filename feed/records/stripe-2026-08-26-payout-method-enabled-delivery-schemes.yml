summary: In Stripe's public preview API version 2026-08-26.preview, the v2 Payout Method bank_account.enabled_delivery_options property was renamed to enabled_delivery_schemes
detail: This applies only to callers on 2026-08-26.preview, or on the preview SDKs that pin it (stripe-python 15.7.0b1, stripe-node 22.7.0-beta.1), who use Global Payouts, which is in private preview. Integrations that read enabled_delivery_options from the bank_account hash of a v2 Payout Method won't receive the expected data and might receive errors.
