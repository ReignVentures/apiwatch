# Written by an author agent from changelog lead #41 (apiwatch watch), from the primary source page only. Independent review (docs/REVIEW.md) 2026-10-31 by a fresh agent: fix (Java/PHP/optional-chaining spellings, attribute reads excluded, preview SDK pin gate with beta CHANGELOG evidence), applied.
# Scope: PUBLIC PREVIEW API version 2026-10-28.preview (v2 money management Financial Addresses).
# Generic names are not bare signatures: last4 and country only as access paths on the affected details (aba.last4, iban.last4, sort_code.last4, iban.country and the
# Go/.NET PascalCase forms). Dict-style reads (["aba"]["last4"]) are not matched. account_holder_address is matched in every SDK spelling the page lists.
# The account_number/iban optional -> required change needs no code change to keep working and has no signature. The added address property is additive.
# context needs a Financial Address and a money management reference in the same file; repo_context gates on a preview API version string or the preview SDK pins (stripe-python 16.2.0b*, stripe-node 23.2.0-beta*, both pinned to 2026-10-28.preview per their beta CHANGELOGs).
id: stripe-2026-10-28-financial-address-bank-account-shape
vendor: Stripe
surface: 'Stripe API 2026-10-28.preview (public preview) — v2 Financial Address bank_account details: last4 removed, aba account_holder_address renamed to address, iban country moved to bank_account'
kind: rest
severity: breaking
effective: '2026-10-28'
summary: 'In Stripe''s public preview API version 2026-10-28.preview, v2 Financial Address bank account details drop last4 (ABA, IBAN, sort code), rename ABA account_holder_address to address, and move IBAN country to the parent bank_account'
detail: 'This applies only to callers on the public preview version 2026-10-28.preview, or on the preview SDKs that pin it (stripe-python 16.2.0b1, stripe-node 23.2.0-beta.1), who use the v2 Financial Addresses API. last4 no longer exists on ABA, IBAN or sort code details; account_holder_address on ABA details is now address; country moves from IBAN details to the parent bank_account object. account_number (ABA, sort code) and iban (IBAN) become required. Stripe classes this as a breaking change. Only access paths such as aba.last4, aba?.last4, aba->last4 and getAba().getLast4() are matched for the generic names, so dictionary-style reads of last4 or country are not flagged.'
