# Promoted from feed/drafts (written by an author agent from a changelog lead (apiwatch watch)) after independent review (docs/REVIEW.md) on 2026-10-02: fix. Facts match; gate needs a digit before .endive; added the .NET form; canonical dependency gates.
# Scope: GA API version 2026-09-30.endive (changelog section "2026-09-30.endive"). Bites only callers who send Stripe-Version 2026-09-30.endive
# (or a later .endive version: the Endive overview says later Endive versions add only additive changes) or who move to the SDK majors that pin it,
# released 2026-09-30: stripe-python 16.0.0, stripe-node 23.0.0, stripe-go v87.0.0, stripe-ruby 20.0.0, stripe-java 34.0.0, stripe-dotnet 53.0.0, stripe-php 22.0.0.
# repo_context gate (plain substring, lowercased, searched in code and dependency manifests): ".endive" catches the version string in code/config;
# the SDK majors are matched in their manifest shapes ("stripe==16", '"stripe": "^23', "stripe-go/v87", "stripe (20." in Gemfile.lock,
# "stripe-java:34." in Gradle, 'Stripe.net" Version="53' in .csproj) because bare "16.0.0"/"23.0.0" would match any package at that version.
# floating ranges such as "stripe>=15", and accounts whose default API version was upgraded in Workbench with no version in code.
# Signatures are the string-value forms (now/unchanged) the change rejects; bare billing_cycle_anchor would also hit Subscription create (timestamp, unchanged) and reads of the property.
# Not covered: the create_preview future-timestamp form (a bare integer) and Go's BillingCycleAnchorNow/Unchanged bools (still present in stripe-go v87; mapping unverified).
id: stripe-2026-09-30-billing-cycle-anchor-object
vendor: Stripe
surface: Stripe API 2026-09-30.endive — billing_cycle_anchor on Subscription update and resume, and Invoice create_preview subscription_details.billing_cycle_anchor
kind: rest
severity: breaking
effective: '2026-09-30'
summary: When you upgrade to Stripe API version 2026-09-30.endive (or an SDK major that pins it), billing_cycle_anchor on Subscription update and resume takes an object with a type field, so passing the string now or unchanged no longer works
detail: 'Replace now with {type: ''now''} and unchanged with {type: ''unchanged''}. When creating a preview invoice for a new subscription whose anchor is a future timestamp, subscription_details.billing_cycle_anchor needs {type: ''timestamp'', timestamp: ...} instead of the bare timestamp. The SDKs that pin this version (stripe-python 16.0.0, stripe-node 23.0.0, stripe-go v87.0.0, stripe-ruby 20.0.0, stripe-java 34.0.0, stripe-dotnet 53.0.0, stripe-php 22.0.0) change the parameter''s type to match.'
