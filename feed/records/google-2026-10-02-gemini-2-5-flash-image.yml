detail: The Gemini API deprecations page lists gemini-2.5-flash-image with a shutdown date of October 2, 2026 and gemini-3.1-flash-image-preview as the replacement; the page says its dates are the earliest possible and that Google will give advance notice of the exact date. The September 18, 2026 release notes say the 2.5 models are not deprecated and will continue to be served until further notice, with access limited to past users. No deprecation announcement for this model appears in the release notes.
