# Independent review (docs/REVIEW.md) on 2026-10-09: pass. Corrected from the primary source: fix_hint no longer routes content search to notion-ai-search (the October 7, 2026 entry says to call notion-search).
# Independent review (docs/REVIEW.md) on 2026-09-24: fixed. The summary and detail now say the Sep 10 follow-up partly reversed the split for connections that can use AI search.
id: notion-2026-09-02-mcp-search-split
vendor: Notion MCP
surface: MCP tool notion-search → notion-search (keyword) + notion-ai-search (semantic)
kind: mcp
severity: silent
effective: "2026-09-02"
summary: notion-search became keyword-only and stopped searching connected apps; semantic search moved to a new notion-ai-search tool; partly reversed Sep 10 for connections that can use AI search
detail: notion-search now matches short, specific terms in Notion only, with no Slack, Google Drive, or Jira results. Agents keep calling it and get narrower results with no error; from Sep 10 this still holds for connections that can't use AI search and for calls with exact filters, an empty query, or a non-relevance sort. notion-ai-search needs Notion AI. The old content_search_mode parameter still works but is no longer advertised (since Sep 10, content_search_mode "ai_search" returns a permission error on connections that can't use notion-ai-search), so agents built from the tool list won't find it. A Sep 10 follow-up routes keyword content queries on notion-search to AI search when the connection allows it, so behavior now depends on plan and tool selection.
signatures: ["notion-search", "content_search_mode"]
