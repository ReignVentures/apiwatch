  - "Content searches sent to notion-search now run AI search"
  - "September 2, 2026"
fix_hint: Since Oct 7, call notion-search for content search; it runs AI search when the user has it, and notion-ai-search is no longer listed in tools/list. On workspace-owned connections, use the search tool the connection lists. When ai_search is available, add an eval that expects a cross-source result.
