id: notion-2026-09-02-mcp-search-split
vendor: Notion MCP
surface: MCP tool notion-search → notion-search (keyword) + notion-ai-search (semantic)
kind: mcp
severity: silent
effective: "2026-09-02"
summary: On Sep 2, notion-search became keyword-only and stopped searching connected apps, and semantic search moved to a new notion-ai-search tool; a Sep 10 follow-up routed some notion-search queries back to AI search, which now applies only on workspace-owned connections
detail: 'From September 2, 2026, notion-search matched short, specific terms in Notion only, with no Slack, Google Drive, or Jira results, so agents that kept calling it got narrower results with no error. Semantic search moved to a new notion-ai-search tool. The old content_search_mode parameter on notion-search kept working (workspace_search behaves like notion-search, ai_search like notion-ai-search) but is no longer advertised, so agents built from the tool list won''t find it. A September 10 follow-up routed keyword content queries on notion-search to AI search when the connection can use it (not calls with an exact filter, an empty query, or a sort other than relevance), and made content_search_mode "ai_search" return a permission error on connections that can''t use notion-ai-search. That routing now applies only to workspace-owned connections: since October 7, 2026 hosted sessions no longer list notion-ai-search (see notion-2026-10-07-mcp-ai-search-unlisted), and since October 20, 2026 hosted notion-search searches only Notion pages and databases, with connected sources searched by notion-connector-search.'
signatures: ["notion-search", "content_search_mode"]
