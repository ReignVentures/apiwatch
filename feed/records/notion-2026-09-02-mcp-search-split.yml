fix_hint: Since Oct 20, hosted notion-search searches only Notion pages and databases; call notion-connector-search for Slack, Google Drive and other connected sources when the session lists it (it needs AI search and a connected source). notion-ai-search is no longer listed in tools/list. On workspace-owned connections, use the search tool the connection lists. Stop sending content_search_mode; call the search tool you want directly.
