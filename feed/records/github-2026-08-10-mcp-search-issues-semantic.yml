summary: GitHub MCP server v1.9.0 made search_issues use semantic search by default on github.com and GHEC, and strips free-text quotes from the query
detail: 'From v1.9.0, search_issues sends search_type=semantic on dotcom and GHEC and falls back to lexical search on GHES; its parameters are unchanged and search_pull_requests is unaffected. Free-text quotes are stripped from the query, so quoted exact-phrase searches no longer match exactly; quotes around qualifier values such as label:"needs triage" are kept. Semantic issue search has its own, lower rate limit: 10 requests/minute versus 30/minute for standard search.'
