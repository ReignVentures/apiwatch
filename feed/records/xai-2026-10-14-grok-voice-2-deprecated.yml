fix_hint: Set model to grok-voice-3.0 where grok-voice-2.0 is pinned (the endpoint, session parameters, events, and price are unchanged). xAI recommends pinning a versioned name in production rather than grok-voice-latest. Grok Voice 3.0 enables reasoning by default (reasoning.effort "high"; set "none" to disable), so re-test sessions after switching.
