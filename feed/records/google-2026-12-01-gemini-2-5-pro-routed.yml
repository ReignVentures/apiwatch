# Authored 2026-11-11 from primary sources only (Markdown twins, fetched 2026-11-11; ai.google.dev 301s to
# aistudio.google.com/docs): the Gemini API changelog (November 2, 2026 entry), the deprecations page (Gemini 2.5
# Pro models), "What's new in Gemini 3.8" (migration checklist) and "What's new in Gemini 3.6" (API changes the 3.8
# guide points to). Found as a gap in the 2026-11-11 record re-review (docs/GAPS.md), not from a lead.
# Severity: breaking. The deprecations page lists a December 1, 2026 shutdown date (within 180 days), and from that
# date requests are served by gemini-3.8-flash under Gemini 3 rules: a request whose last non-empty turn is a model
# turn returns HTTP 400, and temperature, top_p and top_k are ignored. Other requests keep working on a different
# model at a different price.
# Exclude: every other gemini-2.5-pro-* id on Google's pages (the dated previews, preview TTS, exp). No alias:
# gemini-pro-latest moved to gemini-3-pro-preview on January 21, 2026.
# Independent review 2026-11-11 by a fresh reviewer agent: pass. Applied its one wording edit: detail now attributes
# the HTTP 400 and ignored-parameter rules to Google's API changes guide instead of stating them as our inference.
id: google-2026-12-01-gemini-2-5-pro-routed
vendor: Google
surface: Gemini API model gemini-2.5-pro
kind: model
severity: breaking
effective: '2026-12-01'
routes_to: gemini-3.8-flash
summary: From December 1, 2026, Gemini API requests for the deprecated gemini-2.5-pro are routed to gemini-3.8-flash, where prefilled model turns return HTTP 400.
detail: Google's November 2, 2026 changelog says gemini-2.5-pro is deprecated and no longer selectable in Google AI Studio, and that effective December 1, 2026 all API requests to gemini-2.5-pro will automatically route to gemini-3.8-flash and be billed at Gemini 3.8 Flash rates. The deprecations page lists gemini-2.5-pro (released June 17, 2025) with a shutdown date of December 1, 2026 and gemini-3.8-flash as the replacement, and says API access is limited to existing users who have actively used it. Google lists breaking API changes for the move, including function calling and thought_signature validation, thinking_level replacing thinking_budget, and removed sampling parameters and prefilled model turns. Google's API changes guide says that on gemini-3.8-flash and later models a request whose last non-empty turn is a model turn returns HTTP 400 and temperature, top_p and top_k are ignored, and Google tells callers to review these breaking changes before December 1, 2026.
