fix_hint: Before December 1, 2026, change the model string from gemini-2.5-pro to gemini-3.8-flash, as Google directs, and follow the Gemini 3.8 Flash migration guide. Replace thinking_budget with thinking_level (minimal is not supported on 3.8 Flash), remove temperature, top_p, top_k and candidate_count, stop prefilling model turns (those requests return HTTP 400), and re-test function calling. Re-run your evals on quality and cost, since a different model will answer.
exclude:
- gemini-2.5-pro-preview
- gemini-2.5-pro-exp
