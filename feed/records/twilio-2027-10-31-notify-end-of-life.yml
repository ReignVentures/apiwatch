fix_hint: Move off Notify before October 31, 2027. For SMS, send through Twilio's Bulk Messaging API. For push notifications, the replacement is the Push Notifications API, currently in private beta; customers can request access from Twilio. Remove notify.twilio.com calls and client.notify.v1 usage once migrated.
