id: twilio-2027-10-31-notify-end-of-life
vendor: Twilio
surface: Twilio Notify API (notify.twilio.com/v1 Services, Notifications, Bindings) and the Notify resources in Twilio SDKs and CLI
kind: rest
severity: deprecation
effective: '2027-10-31'
summary: Twilio Notify reaches end of life on October 31, 2027 (moved from January 31, 2027); after that, Notify API requests stop working
detail: Announced Nov. 18, 2026. Twilio moved Notify's end-of-life date from January 31, 2027 to October 31, 2027. After October 31, 2027, requests to the Notify API will stop working, and push notifications and SMS sent through Notify won't reach users. Twilio's Notify docs say Twilio stopped supporting Notify in October 2022. Twilio recommends the Bulk Messaging API for SMS; for push notifications the replacement is the new Push Notifications API, which is in private beta; customers can request access.
