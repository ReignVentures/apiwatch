[project]
name = "apiwatch"
version = "0.1.0"
description = "Change intelligence for third-party APIs and MCP servers, with call-site attribution and verified fix briefs"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
live = ["httpx>=0.27"]
agent = ["anthropic>=1.8"]

[project.scripts]
apiwatch = "apiwatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apiwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
